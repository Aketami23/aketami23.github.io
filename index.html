<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aketami23のポートフォリオサイトです。">
  <title>Aketami23 — Portfolio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20252d;
      --muted: #697386;
      --paper: #f7f8fb;
      --card: rgba(255, 255, 255, .78);
      --line: #e4e8f0;
      --accent: #635bff;
      --accent-dark: #433bc7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 88% 8%, #d9e5ff 0, transparent 28rem),
        radial-gradient(circle at 8% 92%, #eee2ff 0, transparent 24rem),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.8;
    }

    a { color: inherit; }

    .wrap {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
    }

    .logo {
      font-weight: 800;
      letter-spacing: .08em;
      text-decoration: none;
    }

    nav { display: flex; gap: 24px; color: var(--muted); font-size: .9rem; }
    nav a { text-decoration: none; }
    nav a:hover { color: var(--accent); }

    .hero {
      min-height: 540px;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 56px;
      padding: 64px 0 100px;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 650px;
      margin: 0;
      font-size: clamp(2.8rem, 8vw, 5.8rem);
      line-height: 1.08;
      letter-spacing: -.06em;
    }

    .lead {
      max-width: 560px;
      margin: 28px 0 32px;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .button {
      display: inline-block;
      padding: 11px 20px;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 10px 22px rgba(99, 91, 255, .2);
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s, background .2s;
    }

    .button:hover { background: var(--accent-dark); transform: translateY(-2px); }

    .shape {
      position: relative;
      min-height: 340px;
      border-radius: 42% 58% 54% 46% / 47% 44% 56% 53%;
      background: linear-gradient(145deg, #746dff, #b49cff 52%, #f2c9ee);
      box-shadow: 24px 28px 0 rgba(99, 91, 255, .09);
      transform: rotate(4deg);
    }

    .shape::before,
    .shape::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, .3);
    }

    .shape::before { width: 92px; height: 92px; top: 16%; right: 17%; }
    .shape::after { width: 38px; height: 38px; bottom: 19%; left: 18%; }

    section { padding: 34px 0 88px; }
    .section-title { margin: 0 0 26px; font-size: 1.8rem; letter-spacing: -.04em; }

    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }

    .card {
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(10px);
    }

    .card-number { color: var(--accent); font-weight: 800; }
    .card h3 { margin: 12px 0 8px; }
    .card p { margin: 0; color: var(--muted); font-size: .94rem; }

    footer {
      padding: 24px 0 34px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .85rem;
    }

    @media (max-width: 720px) {
      .wrap { width: min(100% - 32px, 560px); }
      header { padding: 20px 0; }
      nav { gap: 14px; }
      .hero { grid-template-columns: 1fr; gap: 36px; padding: 64px 0 80px; }
      .shape { min-height: 220px; width: 78%; justify-self: center; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo" href="./">AKETAMI23</a>
      <nav aria-label="メインナビゲーション">
        <a href="#about">About</a>
        <a href="#works">Works</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="about">
        <div>
          <p class="eyebrow">Hello, World.</p>
          <h1>Ideas into<br>something real.</h1>
          <p class="lead">こんにちは。Aketami23です。気になったことを試しながら、Webやデジタルの小さな作品をつくっています。</p>
          <a class="button" href="#works">サイトを見る ↓</a>
        </div>
        <div class="shape" aria-hidden="true"></div>
      </section>

      <section id="works">
        <p class="eyebrow">Selected topics</p>
        <h2 class="section-title">最近やっていること</h2>
        <div class="cards">
          <article class="card">
            <span class="card-number">01</span>
            <h3>Web制作</h3>
            <p>見やすく、触って楽しいWebページをつくります。</p>
          </article>
          <article class="card">
            <span class="card-number">02</span>
            <h3>試行錯誤</h3>
            <p>新しい技術やアイデアを、小さく試して育てています。</p>
          </article>
          <article class="card">
            <span class="card-number">03</span>
            <h3>記録</h3>
            <p>つくったものや学んだことを、ここに残していきます。</p>
          </article>
        </div>
      </section>
    </main>

    <footer>© 2026 Aketami23</footer>
  </div>
</body>
</html>
